name: dev-guardian
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cli-integration:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Real CLI, Git and recovery integration tests
        run: python outputs/dev-guardian/tests/test_guardian.py
